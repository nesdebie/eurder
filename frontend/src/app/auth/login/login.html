<section class="auth-card">
  <h2>Sign in</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Please enter a valid email.</small>
      }
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password is required.</small>
      }
    </div>

    @if (error()) {
      <p class="alert alert-danger">{{ error() }}</p>
    }

    <button type="submit" class="btn-primary" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">No account yet? <a routerLink="/register">Create one</a></p>
</section>
