<section class="tiny-dialog">
  <h3>Find your item</h3>
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" name="name" class="form-control" placeholder="Name" [(ngModel)]="searchText" />
  </div>
</section>
@if (items.isLoading()) {
  <p class="text-muted">Loading items...</p>
} @else if (items.error()) {
  <p class="alert alert-danger">Oops, could not load the items. Is the backend running?</p>
} @else {
  <div class="container-fluid">
    <div class="row">
      <div id="gallery" class="col-md-9">

        @for (item of filteredItems(); track item.id) {
          <div class="gallery" (click)="selectPet(pet)">
            <div class="gallery-pet fader">
              <div class="overlay">
                <div class="overlay-text">{{ item.name }}</div>
              </div>
            </div>
          </div>
        }

      </div>
    </div>
  </div>
}
