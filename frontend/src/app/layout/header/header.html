<header class="colored-background header">
  <a routerLink="/"><img class="logo" src="/images/order.svg" alt="Örder – home" /></a>

  <nav class="nav">
    @if (auth.currentUser(); as user) {
      @if (auth.hasPermission('EURDER_ITEMS')) {
        <a routerLink="/order" routerLinkActive="active" class="order-button"
           [title]="order.count() === 0 ? 'Your cart is empty' : 'See your cart'">
          <img src="/images/shopping-cart.svg" alt="" />
          <span>Cart</span>
          @if (order.count() > 0) {
            <span class="cart-count" aria-label="items in cart">{{ order.count() }}</span>
          }
        </a>
      }
      <span class="user">{{ user.email }}</span>
      <button type="button" class="link-button" (click)="logout()">Sign out</button>
    } @else {
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register" class="nav-cta">Register</a>
    }
  </nav>
</header>
